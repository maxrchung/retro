services:
  postgres:
    image: postgres:18-alpine
    container_name: retro-postgres
    environment:
      POSTGRES_USER: retro
      POSTGRES_PASSWORD: retro
      POSTGRES_DB: retro
    ports:
      - '5433:5432'
    volumes:
      - ./docker/postgres:/var/lib/postgresql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
